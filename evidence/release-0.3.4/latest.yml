releaseNotes: |
  - 左下角「设置」右侧新增「检查更新」，支持查看版本、下载进度和更新说明
  - 更新下载完成后可「重启并更新」，任务运行中保留更新并支持稍后重试
  - 接入 Naumi 统一账号登录，登录页复用 Naumi 产品样式，不同账号的本地数据保持隔离
  - 修复首次登录后尚未连接企业协作时的工作台启动问题
  - 包含全新 Naumi 安装／卸载界面与 Logo，内置钉钉 CLI 和本地浏览器组件

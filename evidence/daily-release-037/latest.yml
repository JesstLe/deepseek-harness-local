releaseNotes: |
  - 工作目标关联原生委派任务，支持同一任务退回修改、版本文件交付及逐项人工验收
  - 文件任务统一使用原生文件卡片，保留旧版本与来源，不再重复生成一份文本交付
  - 支持从本机 Codex、Claude 会话预览后导入，并使用 Naumi 原生会话继续工作；历史工具操作不重放
  - 已确认的工作经验可在新会话和重启后检索复用；本地主动工作需明确启用，未知执行结果不自动重跑
  - 修复部分 Windows 新工作区无法启动受限命令的问题，保留工作区边界与原有权限审批
  - 保留 Naumi 安装／卸载界面、Logo、内置工具与浏览器；升级和卸载保留个人数据

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>浏览器连接 · Naumi</title><link rel="stylesheet" href="browser-manager.css"></head><body><main><header><h1>浏览器连接</h1><button id="refresh" class="quiet">刷新</button></header><section><h2>接管已打开的浏览器</h2><ol><li>在 Chrome / Edge 扩展页启用开发者模式，加载扩展文件夹。</li><li>复制连接码，粘贴到扩展，点击「连接当前标签页」。</li></ol><div class="actions"><button id="extension" class="quiet">打开扩展文件夹</button><button id="pair">复制连接码</button></div><div id="tabs"></div><button id="disconnect" class="quiet">断开当前会话的外部浏览器</button></section><section><h2>网站账号</h2><div id="accounts"></div><form id="account"><label>网站<input name="origin" type="url" placeholder="https://example.com" required></label><label>用户名<input name="username" autocomplete="off" required maxlength="254"></label><label>密码<input name="password" type="password" autocomplete="new-password" required maxlength="4096"></label><label class="check"><input name="allowAgent" type="checkbox">允许 Agent 为此网站填入账号</label><button type="submit">加密保存</button></form></section><p id="status" role="status"></p></main><script src="browser-manager.js"></script></body></html>

// Self-contained preview only: no backend, storage, model requests or production runtime dependency.
function checkPreview(){
 const visible=e=>!!e&&e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden';
 const panel=document.querySelector('.context');
 const metrics=panel.querySelector('.monitor');
 const advanced=panel.querySelector('.advanced');

 const originalAdvanced=advanced.open,originalResource=resource.open;
 const assertions={monitorBottom:Math.abs(metrics.getBoundingClientRect().bottom-panel.getBoundingClientRect().bottom)<3,resourcesInMiddle:resource.getBoundingClientRect().top>panel.querySelector('.agent').getBoundingClientRect().top,standardModeNotDefault:!advanced.open,noTrajectory:![...document.querySelectorAll('button,[role=tab],summary')].some(e=>e.textContent.trim()==='轨迹'),permissionVisible:!document.querySelector('.app')||visible(document.querySelector('.permission')),noHorizontalOverflow:document.documentElement.scrollWidth<=innerWidth+2};

 if(document.querySelector('.app')){const model=document.querySelector('.model-selector');const compose=document.querySelector('.composer');assertions.modelOriginalPosition=!!model&&compose.contains(model)&&visible(model);assertions.singleModelSelector=document.querySelectorAll('.model-selector').length===1&&!panel.querySelector('.model-selector');const left=document.querySelector('.original-sidebar');assertions.originalSidebar=!!left&&!document.querySelector('.rail')&&!document.querySelector('.navigator');assertions.originalNavOrder=[...left.querySelectorAll('.original-nav button span')].map(e=>e.textContent).join('|')==='工作台|项目与需求|交付中心|设计中心|系统连接|插件|自动化任务|更多';document.querySelector('.main-header .context-toggle').click();assertions.contextToggle=document.querySelector('.app').classList.contains('context-hidden')&&visible(document.querySelector('.model-selector'));document.querySelector('.main-header .context-toggle').click();}
